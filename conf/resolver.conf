server:
    # --- Network ---
    verbosity: 2
    # Listen on the interface facing the Client (Adjust IP if needed)
    interface: 192.168.10.2
    interface: 127.0.0.1
    port: 53
    
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # --- Access Control ---
    # Allow the Client subnet to query us
    access-control: 192.168.10.0/24 allow
    access-control: 127.0.0.0/8 allow

    # --- Paths ---
    # IMPORTANT: Replace 'geniuser' with your actual username!
    directory: "/users/hmt"
    username: "unbound"     # Run as current user
    chroot: ""       # Disable chroot to avoid path issues
    pidfile: "unbound.pid"
    logfile: ""      # Log to stderr

    # --- DNSSEC ---
    module-config: "validator iterator"
    
    # trust-anchor: "com. 3600 IN DNSKEY ..."

# --- Stub Zone for .com ---
stub-zone:
    name: "com"
    # The IP of your Knot Nameserver
    stub-addr: 192.168.20.2
    # Force Unbound to use this server even if NS records say otherwise
    stub-prime: no
