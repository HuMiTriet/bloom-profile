server:
    verbosity: 2
    interface: 192.168.10.2
    interface: 127.0.0.1
    port: 53
    
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # --- Access Control ---
    access-control: 192.168.10.0/24 allow
    access-control: 127.0.0.0/8 allow

    # --- Paths & Permissions ---
    directory: "/etc/unbound"             # Standard Linux config directory
    username: "unbound"                   # Drop privileges to the unbound user for security
    # do-daemonize: no                      # Keep 'no' if running via systemd
    chroot: ""                            # Leave empty to prevent file path headaches during testing
    pidfile: "/run/unbound/unbound.pid"   # Standard PID location

    # --- DNSSEC ---
    module-config: "validator iterator"
    
    # Insert your Knot KSK here (see command below)
    trust-anchor: "com. DNSKEY 257 3 13 uxB1dp5NSCpWqzsDKAPgisuMZTRwz14JAEWVibcz72ahqjUNpI17lGrNThmAoUr5YYQX7Zc+T3ryENhlmaLgRA=="

# --- Stub Zone for .com ---
stub-zone:
    name: "com"
    stub-addr: 192.168.20.2
    stub-prime: no
