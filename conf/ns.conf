server:
    # Listen on all interfaces so the Resolver can still reach it remotely
    listen: 0.0.0.0@53
    listen: ::0@53
    
    # Run as current user (crucial for local permission handling in ~/)
    user: ""

log:
  - target: stderr
    any: info

database:
    storage: "."

# --- Access Control List (ACL) ---
acl:
  - id: allow_local_updates
    # ALLOW LOCALHOST (127.0.0.1) and internal IPs to send updates
    address: [127.0.0.1, ::1]
    action: update

# --- DNSSEC Policy ---
policy:
  - id: auto_dnssec
    algorithm: ECDSAP256SHA256
    ksk-lifetime: 365d
    zsk-lifetime: 30d
    nsec3: on

# --- Template ---
template:
  - id: default
    storage: "."
    file: "%s.zone"

# --- Zone Definition ---
zone:
  - domain: com
    # Apply the local ACL
    acl: [ allow_local_updates ]
    dnssec-signing: on
    dnssec-policy: auto_dnssec
