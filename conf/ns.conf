server:
    listen: 127.0.0.1@53
    listen: 192.168.20.2@53
    user: knot:knot
    rundir: "/run/knot"
    async-start: on

log:
  - target: syslog
    any: info

database:
    storage: "/var/lib/knot"

acl:
  - id: allow_python_updates
    address: [ 127.0.0.1 ]
    action: update

# --- DNSSEC Policy ---
policy:
  - id: manual_incremental
    # Tell Knot we are managing the keys manually (the ones we imported)
    manual: on

    # Enable NSEC3 (matching what you likely used in ldns-signzone)
    nsec3: on
    # CRITICAL: Keep Opt-Out enabled to prevent Knot from generating
    # millions of NSEC3 records for insecure delegations in .com
    nsec3-opt-out: on
    nsec3-iterations: 0
    nsec3-salt-length: 0

    # Signature refresh timings
    rrsig-lifetime: 14d
    rrsig-refresh: 2d

template:
  - id: default
    storage: "/var/lib/knot"
    journal-content: changes
    # Prevent disk I/O lockup by not rewriting the 23GB text file
    zonefile-sync: -1
    semantic-checks: off
    zonefile-load: whole

zone:
  - domain: com
    # Point to the file generated by ldns-signzone
    file: "/users/hmt/toy_com.txt"
    acl: [ allow_python_updates ]

    # Enable signing so Knot takes over the maintenance
    dnssec-signing: on
    dnssec-policy: manual_incremental
